plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id

            // 自动重映射 Mixin refmap（Searge -> official）
            // Tacz 和 simplebedrockmodel 都使用 Searge 映射编译
            // 配合此 remapRefMap 设置，refmap 中的 Searge 方法名/字段名会被自动重映射为 official 名称
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // 本地仓库（存放自动下载的 jar 依赖）
    flatDir {
        dirs 'libs'
    }

    // 需要 mavenCentral 来解析 mixin annotation processor
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // ==================== 自动下载依赖 jar ====================
    // 封装下载逻辑：如果 libs/ 下不存在 jar，自动从 URL 下载
    // 三个依赖共享同一个下载函数
    def downloadJar = { String name, String url, File target ->
        if (!target.exists()) {
            logger.lifecycle("=" * 46)
            logger.lifecycle("${name} jar 未找到，正在下载(如果太慢，你也可以将指定版本的${name} jar文件复制到指定目录中)...")
            logger.lifecycle("  URL: ${url}")
            logger.lifecycle("  目标: ${target}")
            try {
                target.parentFile.mkdirs()
                def conn = new URL(url).openConnection()
                // CurseForge CDN 需要 User-Agent，否则返回 403
                conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36")
                conn.setInstanceFollowRedirects(true)
                target.withOutputStream { it << conn.inputStream }
                logger.lifecycle("   ${name} jar 下载成功！")
            } catch (Exception e) {
                logger.warn("   ${name} jar 下载失败：${e.message}")
                logger.warn("   请手动下载文件放到 libs/ 目录下")
                logger.warn("   下载地址: ${url}")
            }
            logger.lifecycle("=" * 46)
        }
    }

    downloadJar("Tacz", tacz_download_url, file("${projectDir}/libs/tacz-1.20.1-1.1.8-hotfix.jar"))
    downloadJar("Embeddium", embeddium_download_url, file("${projectDir}/libs/embeddium-0.3.31+mc1.20.1.jar"))
    downloadJar("Cloth Config API", cloth_config_download_url, file("${projectDir}/libs/cloth-config-11.1.136-forge.jar"))
    // ==========================================================

    // Tacz 本地依赖（编译时需要，运行时用户自己安装）
    compileOnly fg.deobf('tacz:tacz:1.20.1-1.1.8-hotfix')

    // Embeddium 本地依赖（编译时需要，运行时用户自己安装）
    compileOnly fg.deobf('embeddium:embeddium:0.3.31+mc1.20.1')

    // Cloth Config API 本地依赖（编译和运行都需要）
    // 运行时需要和编译时一起打包，或者用户自己安装
    compileOnly fg.deobf('cloth:cloth-config:11.1.136-forge')
    runtimeOnly fg.deobf('cloth:cloth-config:11.1.136-forge')

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// 注意：Tacz、Embeddium 只在编译时需要，运行时需用户自行安装到游戏 mods 目录
// Cloth Config API 同时需要编译时和运行时引用

// Mixin 配置在 mods.toml 中声明

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "taczhacker.mixins.json,taczhacker.embeddium.mixins.json"
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}